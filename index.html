<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandscapeFlow Pro</title>
    <meta name="description" content="Landscaping Management System">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .success {
            color: #27ae60;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .nav {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            border-bottom: 2px solid #f0f0f0;
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: #666;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .property-item {
            padding: 16px;
            background: #f9f9f9;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
        }

        .property-item h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .property-item p {
            font-size: 13px;
            color: #666;
        }

        .logout-btn {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login" id="loginForm">
            <div class="header">
                <div class="logo">🌿</div>
                <h1>LandscapeFlow Pro</h1>
                <p class="subtitle">Landscaping Management System</p>
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Username or Email</label>
                    <input type="text" id="email" placeholder="username or email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit">Login</button>

                <div class="error" id="loginError"></div>
                <div class="success" id="loginSuccess"></div>
            </form>

            <p style="text-align: center; margin-top: 20px; font-size: 13px; color: #666;">
                Demo: john@company.com / pass123
            </p>
        </div>

        <div class="dashboard" id="dashboard">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1>Dashboard</h1>
                <button class="logout-btn" onclick="handleLogout()" style="width: auto; margin: 0; padding: 8px 16px; font-size: 14px;">Logout</button>
            </div>

            <div class="nav" id="navBar">
                <button class="nav-btn active" onclick="switchSection('properties')">Properties</button>
                <button class="nav-btn" onclick="switchSection('schedules')">Schedules</button>
            </div>

            <div class="section active" id="properties">
                <h2>Properties</h2>
                <form onsubmit="handleAddProperty(event)" style="margin-bottom: 24px;">
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" placeholder="123 Main St" required>
                    </div>
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" placeholder="Charlotte" required>
                    </div>
                    <div class="form-group">
                        <label for="size">Size (sq ft)</label>
                        <input type="number" id="size" placeholder="5000" required>
                    </div>
                    <button type="submit">Add Property</button>
                </form>

                <div id="propertiesList" class="loading">
                    <div class="spinner"></div>
                    <p>Loading properties...</p>
                </div>
            </div>

            <div class="section" id="schedules">
                <h2>Schedules</h2>
                <form onsubmit="handleAddSchedule(event)" style="margin-bottom: 24px;">
                    <div class="form-group">
                        <label for="scheduleDate">Date</label>
                        <input type="date" id="scheduleDate" required>
                    </div>
                    <div class="form-group">
                        <label for="scheduleTime">Time</label>
                        <input type="time" id="scheduleTime" required>
                    </div>
                    <button type="submit">Add Schedule</button>
                </form>

                <div id="schedulesList" class="loading">
                    <div class="spinner"></div>
                    <p>Loading schedules...</p>
                </div>
            </div>

            <div class="section" id="users">
                <h2>Users</h2>
                <div id="usersList" class="loading">
                    <div class="spinner"></div>
                    <p>Loading users...</p>
                </div>
            </div>

            <div class="error" id="dashboardError"></div>
        </div>
    </div>

    <script>
        const API_URL = localStorage.getItem('apiUrl') || '';
        let token = localStorage.getItem('token');
        let currentUser = JSON.parse(localStorage.getItem('user') || 'null');

        function isAdmin() {
            return currentUser && currentUser.role === 'admin';
        }

        function setupAdminUI() {
            if (!isAdmin()) return;
            const navBar = document.getElementById('navBar');
            if (!document.getElementById('usersNavBtn')) {
                const btn = document.createElement('button');
                btn.id = 'usersNavBtn';
                btn.className = 'nav-btn';
                btn.textContent = 'Users';
                btn.onclick = () => switchSection('users', btn);
                navBar.appendChild(btn);
            }
        }

        function initDashboard() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            setupAdminUI();
            loadProperties();
            loadSchedules();
        }

        if (token) {
            initDashboard();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            const successEl = document.getElementById('loginSuccess');

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorEl.textContent = data.error || 'Login failed';
                    errorEl.style.display = 'block';
                    return;
                }

                token = data.token;
                currentUser = data.user;
                localStorage.setItem('token', token);
                localStorage.setItem('apiUrl', API_URL);
                localStorage.setItem('user', JSON.stringify(currentUser));
                successEl.textContent = 'Login successful!';
                successEl.style.display = 'block';

                setTimeout(() => {
                    initDashboard();
                }, 500);
            } catch (error) {
                errorEl.textContent = 'Connection error: ' + error.message;
                errorEl.style.display = 'block';
            }
        }

        async function loadProperties() {
            try {
                const response = await fetch(`${API_URL}/api/properties`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const properties = await response.json();

                const list = document.getElementById('propertiesList');
                if (properties.length === 0) {
                    list.innerHTML = '<p style="text-align: center; color: #666;">No properties yet. Add one above!</p>';
                } else {
                    list.innerHTML = properties.map(p => `
                        <div class="property-item">
                            <h3>${p.address}</h3>
                            <p>${p.city} • ${p.size} sq ft</p>
                            ${isAdmin() ? `<button onclick="deleteProperty('${p._id}')" style="width:auto;padding:4px 10px;font-size:12px;background:#e74c3c;margin-top:8px;">Delete</button>` : ''}
                        </div>
                    `).join('');
                }
            } catch (error) {
                document.getElementById('propertiesList').innerHTML = `<p style="color: #e74c3c;">Error loading properties</p>`;
            }
        }

        async function deleteProperty(id) {
            if (!confirm('Delete this property?')) return;
            await fetch(`${API_URL}/api/properties/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadProperties();
        }

        async function loadSchedules() {
            try {
                const response = await fetch(`${API_URL}/api/schedules`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const schedules = await response.json();

                const list = document.getElementById('schedulesList');
                if (schedules.length === 0) {
                    list.innerHTML = '<p style="text-align: center; color: #666;">No schedules yet. Add one above!</p>';
                } else {
                    list.innerHTML = schedules.map(s => `
                        <div class="property-item">
                            <h3>${s.date} at ${s.time}</h3>
                            <p>Status: ${s.status || 'Pending'}</p>
                            ${isAdmin() ? `<button onclick="deleteSchedule('${s._id}')" style="width:auto;padding:4px 10px;font-size:12px;background:#e74c3c;margin-top:8px;">Delete</button>` : ''}
                        </div>
                    `).join('');
                }
            } catch (error) {
                document.getElementById('schedulesList').innerHTML = `<p style="color: #e74c3c;">Error loading schedules</p>`;
            }
        }

        async function deleteSchedule(id) {
            if (!confirm('Delete this schedule?')) return;
            await fetch(`${API_URL}/api/schedules/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadSchedules();
        }

        async function loadUsers() {
            const list = document.getElementById('usersList');
            try {
                const response = await fetch(`${API_URL}/api/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) {
                    list.innerHTML = `<p style="color: #e74c3c;">Not authorized to view users</p>`;
                    return;
                }
                const users = await response.json();
                list.innerHTML = users.map(u => `
                    <div class="property-item">
                        <h3>${u.name || '(no name)'} ${u._id === currentUser.id ? '(you)' : ''}</h3>
                        <p>${u.email}</p>
                        <div style="display:flex; gap:8px; align-items:center; margin-top:8px;">
                            <select onchange="changeUserRole('${u._id}', this.value)" style="width:auto; padding:6px;">
                                ${['admin','manager','crew'].map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${r}</option>`).join('')}
                            </select>
                            ${u._id !== currentUser.id ? `<button onclick="deleteUser('${u._id}')" style="width:auto;padding:6px 12px;font-size:12px;background:#e74c3c;">Delete</button>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                list.innerHTML = `<p style="color: #e74c3c;">Error loading users</p>`;
            }
        }

        async function changeUserRole(id, role) {
            await fetch(`${API_URL}/api/users/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ role })
            });
            loadUsers();
        }

        async function deleteUser(id) {
            if (!confirm('Delete this user?')) return;
            await fetch(`${API_URL}/api/users/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadUsers();
        }

        async function handleAddProperty(e) {
            e.preventDefault();
            const address = document.getElementById('address').value;
            const city = document.getElementById('city').value;
            const size = document.getElementById('size').value;

            try {
                await fetch(`${API_URL}/api/properties`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ address, city, size })
                });

                document.getElementById('address').value = '';
                document.getElementById('city').value = '';
                document.getElementById('size').value = '';
                loadProperties();
            } catch (error) {
                alert('Error adding property');
            }
        }

        async function handleAddSchedule(e) {
            e.preventDefault();
            const date = document.getElementById('scheduleDate').value;
            const time = document.getElementById('scheduleTime').value;

            try {
                await fetch(`${API_URL}/api/schedules`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ date, time, status: 'Pending' })
                });

                document.getElementById('scheduleDate').value = '';
                document.getElementById('scheduleTime').value = '';
                loadSchedules();
            } catch (error) {
                alert('Error adding schedule');
            }
        }

        function switchSection(section, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(section).classList.add('active');
            (btn || event.target).classList.add('active');
            if (section === 'users') loadUsers();
        }

        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('apiUrl');
            localStorage.removeItem('user');
            token = null;
            currentUser = null;
            const usersBtn = document.getElementById('usersNavBtn');
            if (usersBtn) usersBtn.remove();
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').catch(() => {});
        }
    </script>
</body>
</html>
