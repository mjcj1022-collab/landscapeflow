[build]
  command = ""
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://landscapeflow-api-xxxx.onrender.com/:splat"
  status = 200

[context.production]
  [context.production.environment]
    VITE_API_URL = "https://landscapeflow-api-xxxx.onrender.com"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
